name: cleanup

# 清理历史运行记录和过期缓存。
#
# 缓存这条尤其重要：仓库的 Actions 缓存配额是 10GB，超了 GitHub 按 LRU 自动
# 淘汰 —— 淘汰掉的正好是下一次构建要用的 ccache/dl，那次构建就退化成冷编译
# （实测冷启动 80 分钟，热缓存 33 分钟）。每次构建都会写入一份新的 ccache
# 条目（key 带 run_id），没有清理的话配额迟早被自己撑爆。

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0" # 每周一 04:00（Asia/Shanghai）

permissions:
  actions: write
  contents: read

jobs:
  runs:
    name: 清理旧运行记录
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 删除 7 天前的运行记录（保留最近 3 次）
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          retain_days: 7
          keep_minimum_runs: 3
          token: ${{ secrets.GITHUB_TOKEN }}

  caches:
    name: 清理过期缓存
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 每个 key 家族只留最近 2 份（另删 14 天前的）
        run: |
          set -euo pipefail
          cutoff=$(( $(date -u +%s) - 14 * 86400 ))
          # created_at 是带微秒的（2026-11-15T15:21:08.839774Z），jq 的
          # fromdateiso8601 只认 %Y-%m-%dT%H:%M:%SZ，直接喂会报
          # strptime(...) cannot be applied —— 所以先截到秒再补 Z。
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id, .key, (.created_at[0:19] + "Z" | fromdateiso8601)] | @tsv' \
            > "$RUNNER_TEMP/caches.tsv"
          echo "现有 cache: $(wc -l < "$RUNNER_TEMP/caches.tsv") 条"
          # 家族 = key 去掉最后一段（每轮构建都会变的就是那一段）：
          #   ccache-ax6000-43722419766 -> ccache-ax6000
          #   dl-1fb9fe701fac...        -> dl
          # 每个家族按创建时间倒序保留最新 2 份：够 restore-keys 前缀命中，
          # 又不会让 10GB 配额被历史条目占满。另兜底删 14 天前的一律清掉。
          awk -F'\t' '{ fam = $2; sub(/-[^-]*$/, "", fam); print $3 "\t" fam "\t" $1 "\t" $2 }' \
            "$RUNNER_TEMP/caches.tsv" |
          sort -rn |
          awk -F'\t' -v cutoff="$cutoff" '
            { n[$2]++; if (n[$2] > 2 || $1 < cutoff) print $3 "\t" $4 }
          ' > "$RUNNER_TEMP/delete.tsv"
          deleted=0
          while IFS=$'\t' read -r id key; do
            [ -n "${id:-}" ] || continue
            echo "删除 ${id}  ${key}"
            gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null || true
            deleted=$((deleted + 1))
          done < "$RUNNER_TEMP/delete.tsv"
          echo "本次删除 ${deleted} 条"
