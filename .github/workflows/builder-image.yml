name: builder-image

# 构建编译用的宿主镜像，推到 ghcr.io/<owner>/openwrt-builder:24.04。
# build.yml 的 build job 用 container: 引用这个镜像，省掉每次 8 分钟的 apt。

on:
  workflow_dispatch:
  push:
    paths:
      - docker/builder.Dockerfile
      - .github/workflows/builder-image.yml
  # 每月 1 日重建一次，顺带吃 Ubuntu 的安全更新
  schedule:
    - cron: '0 3 1 * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: builder-image
  cancel-in-progress: true

jobs:
  build:
    name: 构建镜像
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/builder.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openwrt-builder:24.04
            ghcr.io/${{ github.repository_owner }}/openwrt-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 结果
        run: |
          echo "镜像已推送："
          echo "  ghcr.io/${{ github.repository_owner }}/openwrt-builder:24.04"
          echo "build.yml 的 build job 会直接引用它。"
